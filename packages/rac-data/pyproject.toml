[project]
name = "rac-data"
version = "0.1.0"
description = "Timeline recording, LeRobot Dataset v3 writing, annotation and browsing"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["rac-link", "numpy>=1.26", "pyarrow>=15", "av>=12", "pandas>=2", "rac-camera"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_data"]

[tool.uv.sources]
rac-link = { workspace = true }
rac-camera = { workspace = true }
