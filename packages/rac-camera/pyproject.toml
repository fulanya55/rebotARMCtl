[project]
name = "rac-camera"
version = "0.1.0"
description = "Single camera capture module publishing shared timestamped frames"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["numpy>=1.26", "rac-link", "opencv-python-headless>=4.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_camera"]

[tool.uv.sources]
rac-link = { workspace = true }
