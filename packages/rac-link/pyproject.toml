[project]
name = "rac-link"
version = "0.1.0"
description = "RAC-Link wire protocol and Python SDK for the STM32 sync controller"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["pyserial>=3.5", "msgpack>=1.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_link"]
