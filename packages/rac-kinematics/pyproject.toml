[project]
name = "rac-kinematics"
version = "0.1.0"
description = "URDF parsing, FK, DLS IK, gravity torque and trajectory generation"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_kinematics"]
