[project]
name = "rac-lerobot"
version = "0.1.0"
description = "LeRobot Robot and Teleoperator proxies that talk to the Controller Service"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["rac-link", "numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_lerobot"]

[tool.uv.sources]
rac-link = { workspace = true }
