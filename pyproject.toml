[project]
name = "rebotarmctl"
version = "0.1.0"
description = "Data collection and deployment platform with an STM32 sync controller for reBot Arm B601-RS and Star Arm 102"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "rac-link",
    "rac-kinematics",
    "rac-service",
    "rac-camera",
    "rac-data",
    "rac-policy",
    "rac-lerobot",
    "makermodslab",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    # Portable C compiler for the firmware software-in-the-loop build. Comes
    # through uv like every other tool, so no system compiler is required.
    "ziglang==0.15.2",
    "pyyaml>=6",
    "playwright>=1.45",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/lab"]

[tool.uv.sources]
rac-link = { workspace = true }
rac-kinematics = { workspace = true }
rac-service = { workspace = true }
rac-camera = { workspace = true }
rac-data = { workspace = true }
rac-policy = { workspace = true }
rac-lerobot = { workspace = true }
makermodslab = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["apps/lab", "third_party", "hardware"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
